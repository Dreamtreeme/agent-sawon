name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent-sawon
      - name: Require public contract repository configuration
        env:
          BENCH_REPOSITORY: ${{ vars.BENCH_REPOSITORY }}
        run: test -n "$BENCH_REPOSITORY"
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.BENCH_REPOSITORY }}
          path: agent-sawon-bench
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e agent-sawon-bench/interfaces -e './agent-sawon[dev]'
      - run: python -m ruff check .
        working-directory: agent-sawon
      - run: python -m ruff format --check .
        working-directory: agent-sawon
      - run: python -m pytest
        working-directory: agent-sawon
