name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent-sawon
      - name: Require contract repository configuration
        env:
          BENCH_REPOSITORY: ${{ vars.BENCH_REPOSITORY }}
        run: test -n "$BENCH_REPOSITORY"
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.BENCH_REPOSITORY }}
          path: agent-sawon-bench
          ssh-key: ${{ secrets.BENCH_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e agent-sawon-bench/interfaces -e './agent-sawon[dev,pipeline]' 'opencv-python-headless>=4.10,<5'
      - name: Require visual test dependency
        run: python -c "import cv2; print(cv2.__version__)"
      - run: python -m ruff check .
        working-directory: agent-sawon
      - run: python -m ruff format --check .
        working-directory: agent-sawon
      - run: python -m pytest --junitxml=test-results.xml
        working-directory: agent-sawon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results-${{ matrix.os }}
          path: agent-sawon/test-results.xml

  parallel:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent-sawon
      - name: Require contract repository configuration
        env:
          BENCH_REPOSITORY: ${{ vars.BENCH_REPOSITORY }}
        run: test -n "$BENCH_REPOSITORY"
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.BENCH_REPOSITORY }}
          path: agent-sawon-bench
          ssh-key: ${{ secrets.BENCH_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e agent-sawon-bench/interfaces -e './agent-sawon[dev,pipeline]' 'opencv-python-headless>=4.10,<5'
      - name: Require visual test dependency
        run: python -c "import cv2; print(cv2.__version__)"
      - run: python -m pytest -n 4 --dist load --max-worker-restart=0 --junitxml=test-results.xml
        working-directory: agent-sawon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel-results-ubuntu
          path: agent-sawon/test-results.xml
