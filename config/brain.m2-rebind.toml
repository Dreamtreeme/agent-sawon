schema_version = "0.1"
summary_strategy = "label_grouped"
max_steps = 80
max_subgoal_failures = 2
max_cost_usd = 0.50
model_call_reserve_usd = 0.025
http_timeout_seconds = 30
observation_max_depth = 12
max_summary_elements = 500
navigation_history_size = 12
recovery_enabled = true

[cache]
enabled = true
path = "../cases/semantic-cache.json"
max_retries = 1
matching_mode = 'rebind'
min_anchor_fields = 2
rebind_model_max_calls = 1
