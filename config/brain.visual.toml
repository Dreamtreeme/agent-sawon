schema_version = "0.1"
visual_screen_fill = true
visual_model_led_semantics = true
visual_model_only_review = true
screen_matching = true
task_path = "../examples/shipment-task.json"
summary_strategy = "label_grouped"
max_steps = 80
max_cost_usd = 3.0
guard_mode = "observe_only"
model_call_reserve_usd = 0.025
recovery_enabled = false

# 최근 3턴 델타만 프롬프트에 유지하여 토큰 폭증과 attention drift 방지
visual_rolling_buffer_size = 3
max_feedback_history = 3

[visual_detector]
device = "cuda:0"
weights = "../data/models/omniparser-v2/icon_detect/model.pt"
image_size = 640
python = "../.tools/vision-venv/Scripts/python.exe"

[visual_match_cache]
enabled = true
path = "../cases/visual-match-cache.json"

[methods]
enabled = true
path = "../cases/methods.json"
promotion_path = "../cases/methods.json"
compiled_only = true
max_phash_distance = 6
